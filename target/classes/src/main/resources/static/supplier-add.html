<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart — Add Supplier</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="sidebar">
    <div class="sidebar-header"><div class="logo">FreshMart</div><div class="logo-sub">Admin Portal</div></div>
    <div class="sidebar-nav">
        <p class="nav-section-title">Main</p><ul><li><a href="admin-dashboard.html"><span class="nav-icon">🏠</span>Dashboard</a></li></ul>
        <p class="nav-section-title">Inventory</p><ul>
            <li><a href="product-list.html"><span class="nav-icon">🛒</span>Products</a></li>
            <li><a href="stock-list.html"><span class="nav-icon">📦</span>Stock Control</a></li>
            <li><a href="supplier-list.html" class="active"><span class="nav-icon">🚚</span>Suppliers</a></li>
        </ul>
        <p class="nav-section-title">Sales</p><ul>
            <li><a href="sales-list.html"><span class="nav-icon">💳</span>Sales</a></li>
            <li><a href="reports.html"><span class="nav-icon">📈</span>Reports</a></li>
        </ul>
        <p class="nav-section-title">Admin</p><ul><li><a href="user-list.html"><span class="nav-icon">👥</span>Users</a></li></ul>
    </div>
    <div class="sidebar-footer"><a href="index.html"><span class="nav-icon">🚪</span>Logout</a></div>
</nav>
<div class="main-content">
    <div class="top-bar">
        <div class="top-bar-title"><h1>Add Supplier</h1><p>Register a new supplier</p></div>
        <div class="top-bar-right"><div class="user-badge"><div class="user-avatar">A</div><span>Admin</span></div></div>
    </div>
    <div class="page-content">
        <div class="card form-section">
            <div class="card-header"><h3>Supplier Details</h3></div>
            <div class="card-body">
                <form onsubmit="save(event)">
                    <div class="input-group"><label>Supplier ID</label><input type="text" id="sid" placeholder="e.g. SUP001" required></div>
                    <div class="input-group"><label>Supplier Name</label><input type="text" id="sname" placeholder="e.g. FreshFarm Ltd" required></div>
                    <div class="input-group"><label>Contact Info</label><input type="text" id="scontact" placeholder="e.g. 077-1234567" required></div>
                    <div class="btn-actions mt-16">
                        <button type="submit" class="btn btn-primary">Register Supplier</button>
                        <a href="supplier-list.html" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
async function save(e) {
    e.preventDefault();
    await fetch('http://localhost:8080/api/suppliers', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ id: document.getElementById('sid').value, name: document.getElementById('sname').value, contactInfo: document.getElementById('scontact').value })
    });
    alert('Supplier added!');
    window.location.href = 'supplier-list.html';
}
</script>
</body></html>
