<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart — Add Product</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="sidebar">
    <div class="sidebar-header"><div class="logo">FreshMart</div><div class="logo-sub">Admin Portal</div></div>
    <div class="sidebar-nav">
        <p class="nav-section-title">Main</p><ul><li><a href="admin-dashboard.html"><span class="nav-icon">🏠</span>Dashboard</a></li></ul>
        <p class="nav-section-title">Inventory</p><ul>
            <li><a href="product-list.html" class="active"><span class="nav-icon">🛒</span>Products</a></li>
            <li><a href="stock-list.html"><span class="nav-icon">📦</span>Stock Control</a></li>
            <li><a href="supplier-list.html"><span class="nav-icon">🚚</span>Suppliers</a></li>
        </ul>
        <p class="nav-section-title">Sales</p><ul>
            <li><a href="sales-list.html"><span class="nav-icon">💳</span>Sales</a></li>
            <li><a href="reports.html"><span class="nav-icon">📈</span>Reports</a></li>
        </ul>
        <p class="nav-section-title">Admin</p><ul><li><a href="user-list.html"><span class="nav-icon">👥</span>Users</a></li></ul>
    </div>
    <div class="sidebar-footer"><a href="index.html"><span class="nav-icon">🚪</span>Logout</a></div>
</nav>
<div class="main-content">
    <div class="top-bar">
        <div class="top-bar-title"><h1>Add Product</h1><p>Register a new item in the catalog</p></div>
        <div class="top-bar-right"><div class="user-badge"><div class="user-avatar">A</div><span>Admin</span></div></div>
    </div>
    <div class="page-content">
        <div class="card form-section">
            <div class="card-header"><h3>Product Details</h3></div>
            <div class="card-body">
                <form onsubmit="save(event)">
                    <div class="form-grid-2">
                        <div class="input-group">
                            <label>Product ID</label>
                            <input type="text" id="pid" placeholder="e.g. P001" required>
                        </div>
                        <div class="input-group">
                            <label>Product Name</label>
                            <input type="text" id="pname" placeholder="e.g. Fresh Milk" required>
                        </div>
                    </div>
                    <div class="form-grid-2">
                        <div class="input-group">
                            <label>Price (LKR)</label>
                            <input type="number" id="pprice" step="0.01" min="0" placeholder="0.00" required>
                        </div>
                        <div class="input-group">
                            <label>Product Type</label>
                            <select id="ptype" onchange="toggleFields()">
                                <option value="Perishable">Perishable (Food / Fresh)</option>
                                <option value="Electronics">Electronics</option>
                            </select>
                        </div>
                    </div>

                    <div id="perishableFields">
                        <div class="input-group">
                            <label>Expiry Date</label>
                            <input type="date" id="pexpiry">
                        </div>
                    </div>

                    <div id="electronicsFields" style="display:none">
                        <div class="input-group">
                            <label>Warranty (months)</label>
                            <input type="number" id="pwarranty" min="0" placeholder="12">
                        </div>
                    </div>

                    <div class="btn-actions mt-16">
                        <button type="submit" class="btn btn-primary">Save Product</button>
                        <a href="product-list.html" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
function toggleFields() {
    const type = document.getElementById('ptype').value;
    document.getElementById('perishableFields').style.display = type === 'Perishable' ? 'block' : 'none';
    document.getElementById('electronicsFields').style.display = type === 'Electronics' ? 'block' : 'none';
}

async function save(e) {
    e.preventDefault();
    const type = document.getElementById('ptype').value;
    const payload = {
        id:   document.getElementById('pid').value.trim(),
        name: document.getElementById('pname').value.trim(),
        price: parseFloat(document.getElementById('pprice').value),
        type: type,
        expiryDate:     type === 'Perishable'  ? document.getElementById('pexpiry').value   : null,
        warrantyMonths: type === 'Electronics' ? parseInt(document.getElementById('pwarranty').value) : null
    };

    const btn = document.querySelector('.btn-primary');
    btn.textContent = 'Saving…';
    btn.disabled = true;

    try {
        const res = await fetch('http://localhost:8080/api/products', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if (res.ok) {
            alert('Product saved successfully!');
            window.location.href = 'product-list.html';
        } else {
            alert('Error saving product. Check console.');
            console.error(await res.text());
        }
    } catch(err) {
        alert('Cannot reach server. Is Spring Boot running?');
    } finally {
        btn.textContent = 'Save Product';
        btn.disabled = false;
    }
}
</script>
</body></html>
