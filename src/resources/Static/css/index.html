<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { flex-direction: column !important; background: #0f172a; }
        .auth-switch { text-align:center; margin-top:18px; font-size:14px; color:var(--text-muted); }
        .auth-switch a {color:var(--accent); font-weight:600; text-decoration:none; }
        .auth-switch a:hover { text-decoration:underline; }
        .tab-row { display:flex; gap:8px; margin-bottom:20px; }
        .tab-btn { flex:1; padding:10px; border:2px solid var(--border); border-radius:8px;
                   background:transparent; color:var(--text-muted); font-size:14px;
                   font-weight:600; cursor:pointer; transition:.2s; }
        .tab-btn.active { border-color:var(--accent); color:var(--accent); background:rgba(99,102,241,.08); }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-box">
        <div class="auth-top">
            <div class="auth-logo">🛒</div>
            <h1>FreshMart</h1>
            <p>Supermarket Management System</p>
        </div>
        <div class="auth-form-inner">
            <h2>Welcome Back</h2>
            <p class="sub">Sign in to your account.</p>

            <!-- Role Tabs -->
            <div class="tab-row">
                <button class="tab-btn active" id="tabAdmin" onclick="setTab('admin')">🔑 Admin</button>
                <button class="tab-btn" id="tabCustomer" onclick="setTab('customer')">🛍️ Customer</button>
            </div>

            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" autocomplete="username">
            </div>
            <div class="input-group mb-0">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>

            <div class="error-msg" id="error-msg">Invalid credentials or server offline.</div>

            <button class="btn btn-primary w-full mt-16" style="justify-content:center;" onclick="login()">Sign In</button>

            <div class="auth-switch" id="registerLink">
                New customer? <a href="customer-register.html">Create an account</a>
            </div>
        </div>
    </div>
</div>

<script>
    let currentTab = 'admin';

    function setTab(tab) {
        currentTab = tab;
        document.getElementById('tabAdmin').classList.toggle('active', tab === 'admin');
        document.getElementById('tabCustomer').classList.toggle('active', tab === 'customer');
        document.getElementById('registerLink').style.display = tab === 'customer' ? 'block' : 'none';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
    }
    setTab('admin'); // default — hide register link

    async function login() {
        const u   = document.getElementById('username').value.trim();
        const p   = document.getElementById('password').value;
        const btn = document.querySelector('.btn-primary');
        const err = document.getElementById('error-msg');
        err.style.display = 'none';
        btn.textContent = 'Signing in…';
        btn.style.opacity = '0.75';

        try {
            const res    = await fetch('http://localhost:8080/api/users/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: u, password: p })
            });
            const result = await res.text();
            if (result === 'ERROR') {
                err.textContent = 'Incorrect username or password.';
                err.style.display = 'block';
            } else {
                // Store username for profile page
                sessionStorage.setItem('username', u);
                window.location.href = result.startsWith('/') ? result.substring(1) : result;
            }
        } catch (e) {
            err.textContent = 'Cannot reach server — please start the Spring Boot app in IntelliJ.';
            err.style.display = 'block';
        } finally {
            btn.textContent = 'Sign In';
            btn.style.opacity = '1';
        }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
