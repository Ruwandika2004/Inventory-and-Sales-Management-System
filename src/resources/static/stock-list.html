<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart — Stock List</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="sidebar">
    <div class="sidebar-header"><div class="logo">FreshMart</div><div class="logo-sub">Admin Portal</div></div>
    <div class="sidebar-nav">
        <p class="nav-section-title">Main</p><ul><li><a href="admin-dashboard.html"><span class="nav-icon">🏠</span>Dashboard</a></li></ul>
        <p class="nav-section-title">Inventory</p><ul>
        <li><a href="product-list.html"><span class="nav-icon">🛒</span>Products</a></li>
        <li><a href="stock-list.html" class="active"><span class="nav-icon">📦</span>Stock Control</a></li>
        <li><a href="supplier-list.html"><span class="nav-icon">🚚</span>Suppliers</a></li>
    </ul>
        <p class="nav-section-title">Sales</p><ul>
        <li><a href="sales-list.html"><span class="nav-icon">💳</span>Sales</a></li>
        <li><a href="reports.html"><span class="nav-icon">📈</span>Reports</a></li>
    </ul>
        <p class="nav-section-title">Admin</p><ul><li><a href="user-list.html"><span class="nav-icon">👥</span>Users</a></li></ul>
    </div>
    <div class="sidebar-footer"><a href="index.html"><span class="nav-icon">🚪</span>Logout</a></div>
</nav>
<div class="main-content">
    <div class="top-bar">
        <div class="top-bar-title"><h1>Stock Control</h1><p>Manage inventory transactions</p></div>
        <div class="top-bar-right">
            <a href="stock-add.html" class="btn btn-primary">+ Add Transaction</a>
            <div class="user-badge"><div class="user-avatar">A</div><span>Admin</span></div>
        </div>
    </div>
    <div class="page-content">
        <div class="card">
            <div class="card-header">
                <h3>Stock Ledger</h3>
                <div class="search-bar"><input type="text" id="searchBox" placeholder="Search product ID…" oninput="filter()"></div>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>Txn ID</th><th>Product ID</th><th>Quantity</th><th>Type</th><th>Actions</th></tr></thead>
                    <tbody id="list"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    let all = [];
    async function load() {
        const res = await fetch('http://localhost:8080/api/stock');
        all = await res.json();
        render(all);
    }
    function render(data) {
        const tbody = document.getElementById('list');
        if (!data.length) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:40px">No transactions found.</td></tr>'; return; }
        tbody.innerHTML = data.map(s => `<tr>
            <td><code style="font-size:12px;background:#f1f5f9;padding:2px 6px;border-radius:4px">${s.transactionId}</code></td>
            <td>${s.productId}</td>
            <td><strong>${s.quantity}</strong></td>
            <td><span class="badge ${s.type === 'IN' ? 'badge-green' : 'badge-red'}">${s.type}</span></td>
            <td><a href="stock-edit.html?id=${s.transactionId}&pid=${s.productId}&qty=${s.quantity}&type=${s.type}" class="btn btn-blue btn-sm">Edit</a></td>
        </tr>`).join('');
    }
    function filter() {
        const q = document.getElementById('searchBox').value.toLowerCase();
        render(all.filter(s => s.productId.toLowerCase().includes(q) || s.transactionId.toLowerCase().includes(q)));
    }
    load();
</script>
</body></html>
