<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart — Product List</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="sidebar">
    <div class="sidebar-header"><div class="logo">FreshMart</div><div class="logo-sub">Admin Portal</div></div>
    <div class="sidebar-nav">
        <p class="nav-section-title">Main</p><ul><li><a href="admin-dashboard.html"><span class="nav-icon">🏠</span>Dashboard</a></li></ul>
        <p class="nav-section-title">Inventory</p><ul>
            <li><a href="product-list.html" class="active"><span class="nav-icon">🛒</span>Products</a></li>
            <li><a href="stock-list.html"><span class="nav-icon">📦</span>Stock Control</a></li>
            <li><a href="supplier-list.html"><span class="nav-icon">🚚</span>Suppliers</a></li>
        </ul>
        <p class="nav-section-title">Sales</p><ul>
            <li><a href="sales-list.html"><span class="nav-icon">💳</span>Sales</a></li>
            <li><a href="reports.html"><span class="nav-icon">📈</span>Reports</a></li>
        </ul>
        <p class="nav-section-title">Admin</p><ul><li><a href="user-list.html"><span class="nav-icon">👥</span>Users</a></li></ul>
    </div>
    <div class="sidebar-footer"><a href="index.html"><span class="nav-icon">🚪</span>Logout</a></div>
</nav>
<div class="main-content">
    <div class="top-bar">
        <div class="top-bar-title"><h1>Products</h1><p>Manage the product catalog</p></div>
        <div class="top-bar-right">
            <a href="product-add.html" class="btn btn-primary">+ Add Product</a>
            <div class="user-badge"><div class="user-avatar">A</div><span>Admin</span></div>
        </div>
    </div>
    <div class="page-content">
        <div class="card">
            <div class="card-header">
                <h3>All Products</h3>
                <div class="search-bar"><input type="text" id="searchBox" placeholder="Search products…" oninput="filter()"></div>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Type</th><th>Extra Info</th><th>Actions</th></tr></thead>
                    <tbody id="list"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
let all = [];
async function load() {
    const res = await fetch('http://localhost:8080/api/products');
    all = await res.json();
    render(all);
}
function render(data) {
    const tbody = document.getElementById('list');
    if (!data.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:40px">No products found.</td></tr>'; return; }
    tbody.innerHTML = data.map(p => {
        const isPerishable = p.category === 'Perishable';
        const extra = isPerishable ? (p.expiryDate || '—') : ((p.warrantyMonths || '—') + ' months warranty');
        return `<tr>
            <td><code style="font-size:12px;background:#f1f5f9;padding:2px 6px;border-radius:4px">${p.id}</code></td>
            <td><strong>${p.name}</strong></td>
            <td>LKR ${parseFloat(p.price).toFixed(2)}</td>
            <td><span class="badge ${isPerishable ? 'badge-green' : 'badge-blue'}">${p.category || 'Product'}</span></td>
            <td class="text-muted">${extra}</td>
            <td><a href="product-edit.html?id=LKR {p.id}&name=LKR {encodeURIComponent(p.name)}&price=LKR {p.price}&type=LKR {p.category}&expiry=LKR {p.expiryDate||''}&warranty=LKR {p.warrantyMonths||''}" class="btn btn-blue btn-sm">Edit</a></td>
        </tr>`;
    }).join('');
}
function filter() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    render(all.filter(p => p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)));
}
load();
</script>
</body></html>
