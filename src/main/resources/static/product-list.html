<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart — Product List</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Small custom layout style to handle alignment of filter elements */
        .filter-container {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .filter-select {
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background-color: white;
        }
    </style>
</head>
<body>
<nav class="sidebar">
    <div class="sidebar-header"><div class="logo">FreshMart</div><div class="logo-sub">Admin Portal</div></div>
    <div class="sidebar-nav">
        <p class="nav-section-title">Main</p><ul><li><a href="admin-dashboard.html"><span class="nav-icon">🏠</span>Dashboard</a></li></ul>
        <p class="nav-section-title">Inventory</p><ul>
        <li><a href="product-list.html" class="active"><span class="nav-icon">🛒</span>Products</a></li>
        <li><a href="stock-list.html"><span class="nav-icon">📦</span>Stock Control</a></li>
        <li><a href="supplier-list.html"><span class="nav-icon">🚚</span>Suppliers</a></li>
    </ul>
        <p class="nav-section-title">Sales</p><ul>
        <li><a href="sales-list.html"><span class="nav-icon">💳</span>Sales</a></li>
        <li><a href="reports.html"><span class="nav-icon">📈</span>Reports</a></li>
    </ul>
        <p class="nav-section-title">Admin</p><ul><li><a href="user-list.html"><span class="nav-icon">👥</span>Users</a></li></ul>
    </div>
    <div class="sidebar-footer"><a href="index.html"><span class="nav-icon">🚪</span>Logout</a></div>
</nav>
<div class="main-content">
    <div class="top-bar">
        <div class="top-bar-title"><h1>Product Management</h1><p>Manage the product catalog</p></div>
        <div class="top-bar-right">
            <a href="product-add.html" class="btn btn-primary">+ Add New Product</a>
            <div class="user-badge"><div class="user-avatar">A</div><span>Admin</span></div>
        </div>
    </div>
    <div class="page-content">
        <div class="card">
            <div class="card-header">
                <h3>All Products</h3>
                <div class="filter-container">
                    <select id="typeFilter" class="filter-select" onchange="filter()">
                        <option value="All">All Types</option>
                        <option value="Perishable">Perishable Only</option>
                        <option value="Electronics">Electronics Only</option>
                    </select>
                    <div class="search-bar"><input type="text" id="searchBox" placeholder="Search products…" oninput="filter()"></div>
                </div>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Category</th><th>Extra Info</th><th>Actions</th></tr></thead>
                    <tbody id="list"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let all = [];

    // Fetch product data from the backend API
    async function load() {
        try {
            const res = await fetch('http://localhost:8080/api/products');
            all = await res.json();
            render(all);
        } catch (err) {
            console.error("Error loading products:", err);
        }
    }

    // Dynamically generate and render table rows based on product array
    function render(data) {
        const tbody = document.getElementById('list');
        if (!data || !data.length) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:40px">No products found.</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(p => {
            const isPerishable = p.category === 'Perishable';
            const extra = isPerishable ? (p.expiryDate || '—') : ((p.warrantyMonths || '0') + ' months warranty');

            return `<tr>
                <td><code style="font-size:12px;background:#f1f5f9;padding:2px 6px;border-radius:4px">${p.id}</code></td>
                <td><strong>${p.name}</strong></td>
                <td>LKR ${parseFloat(p.price).toFixed(2)}</td>
                <td><span class="badge ${isPerishable ? 'badge-green' : 'badge-blue'}">${p.category || 'Product'}</span></td>
                <td class="text-muted">${extra}</td>
                <td>
                    <a href="product-edit.html?id=${p.id}&name=${encodeURIComponent(p.name)}&price=${p.price}&type=${p.category}&expiry=${p.expiryDate||''}&warranty=${p.warrantyMonths||''}"
                       class="btn btn-blue btn-sm">Edit</a>

                    <button onclick="deleteProduct('${p.id}')" class="btn btn-sm" style="background-color: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-left: 5px;">Delete</button>
                </td>
            </tr>`;
        }).join('');
    }

    // Handle product deletion via DELETE HTTP request execution
    async function deleteProduct(id) {
        if (confirm('Are you sure you want to delete product ' + id + '?')) {
            try {
                const res = await fetch(`http://localhost:8080/api/products/${id}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    alert('Product deleted successfully!');
                    load(); // Trigger database refresh logic to update view states
                } else {
                    alert('Failed to delete product.');
                }
            } catch (err) {
                alert('Cannot reach server.');
            }
        }
    }

    // Combined dual-filter criteria targeting search queries and product categories concurrently
    function filter() {
        const q = document.getElementById('searchBox').value.toLowerCase();
        const selectedType = document.getElementById('typeFilter').value;

        let filteredList = all;

        // 1. Evaluate filter criteria based on product category type selection
        if (selectedType !== 'All') {
            filteredList = filteredList.filter(p => p.category === selectedType);
        }

        // 2. Evaluate filter criteria against user query match (ID / Name properties)
        filteredList = filteredList.filter(p =>
            p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)
        );

        render(filteredList);
    }

    load();
</script>
</body>
</html>
