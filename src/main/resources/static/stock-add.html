<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart — Add Stock</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="sidebar">
    <div class="sidebar-header"><div class="logo">FreshMart</div><div class="logo-sub">Admin Portal</div></div>
    <div class="sidebar-nav">
        <p class="nav-section-title">Main</p><ul><li><a href="admin-dashboard.html"><span class="nav-icon">🏠</span>Dashboard</a></li></ul>
        <p class="nav-section-title">Inventory</p><ul>
            <li><a href="product-list.html"><span class="nav-icon">🛒</span>Products</a></li>
            <li><a href="stock-list.html" class="active"><span class="nav-icon">📦</span>Stock Control</a></li>
            <li><a href="supplier-list.html"><span class="nav-icon">🚚</span>Suppliers</a></li>
        </ul>
        <p class="nav-section-title">Sales</p><ul>
            <li><a href="sales-list.html"><span class="nav-icon">💳</span>Sales</a></li>
            <li><a href="reports.html"><span class="nav-icon">📈</span>Reports</a></li>
        </ul>
        <p class="nav-section-title">Admin</p><ul><li><a href="user-list.html"><span class="nav-icon">👥</span>Users</a></li></ul>
    </div>
    <div class="sidebar-footer"><a href="index.html"><span class="nav-icon">🚪</span>Logout</a></div>
</nav>
<div class="main-content">
    <div class="top-bar">
        <div class="top-bar-title"><h1>Add Transaction</h1><p>Record a stock movement</p></div>
        <div class="top-bar-right"><div class="user-badge"><div class="user-avatar">A</div><span>Admin</span></div></div>
    </div>
    <div class="page-content">
        <div class="card form-section">
            <div class="card-header"><h3>Transaction Details</h3></div>
            <div class="card-body">
                <form onsubmit="save(event)">
                    <div class="form-grid-2">
                        <div class="input-group"><label>Transaction ID</label><input type="text" id="tid" placeholder="e.g. TXN001" required></div>
                        <div class="input-group"><label>Product ID</label><input type="text" id="tpid" placeholder="e.g. P001" required></div>
                    </div>
                    <div class="form-grid-2">
                        <div class="input-group"><label>Quantity</label><input type="number" id="tqty" min="1" placeholder="Enter quantity" required></div>
                        <div class="input-group"><label>Type</label>
                            <select id="ttype">
                                <option value="IN">IN — Receive Stock</option>
                                <option value="OUT">OUT — Issue Stock</option>
                            </select>
                        </div>
                    </div>
                    <div class="btn-actions mt-16">
                        <button type="submit" class="btn btn-primary">Record Transaction</button>
                        <a href="stock-list.html" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
async function save(e) {
    e.preventDefault();
    await fetch('http://localhost:8080/api/stock', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ transactionId: document.getElementById('tid').value, productId: document.getElementById('tpid').value, quantity: parseInt(document.getElementById('tqty').value), type: document.getElementById('ttype').value, timestamp: new Date().toISOString() })
    });
    alert('Transaction recorded!');
    window.location.href = 'stock-list.html';
}
</script>
</body></html>
